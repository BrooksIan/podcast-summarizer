[project]
name = "podcast-summarizer-worker"
version = "0.1.0"
description = "Mistral Workflow worker: transcribes and summarizes new podcast episodes from an RSS feed."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
